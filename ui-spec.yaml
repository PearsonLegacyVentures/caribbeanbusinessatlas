# Caribbean Business Atlas — implementation contract
# Based on HorizonX Vibe Coding UI Specification v1.0 (MIT resource).
# https://horizonx.so/resources/vibe-coding-ui-specification.md
spec:
  name: Caribbean Business Atlas Editorial UI
  version: 1.0.0
  owner: Caribbean Business Atlas
  last_updated: "2026-10-16"
product:
  audience:
    primary: Caribbean founders, operators, travelers, investors and regional business readers
    context: mobile-first business journalism, researched profiles, company discovery
  primary_job: find credible stories and companies
  primary_action: read a featured story
  secondary_actions: [explore directory, filter by country, view company profile]
visual_direction:
  attributes: [premium editorial, Caribbean-rooted, confident typography, generous rhythm, restrained motion]
  avoid: [generic equal-height SaaS cards, ornamental fake data, low-contrast copy, heavy animation]
  references:
    - url: https://horizonx.so/resources/vibe-coding-ui-specification
      use_for: interaction and design system consistency
      do_not_copy: branded layouts and premium templates
tokens:
  color:
    background: "#F6F3E9"
    surface: "#FFFDF7"
    surface_elevated: "#FFFFFF"
    text: "#112B2A"
    text_muted: "#53665E"
    border: "#C5CEC3"
    accent: "#DDF07B"
    accent_foreground: "#112B2A"
    highlight: "#EB8159"
    success: "#326A50"
    warning: "#8C5D12"
    danger: "#9B322A"
    focus: "#F2AD50"
    inverse: "#112B2A"
    inverse_foreground: "#FFFDF7"
  typography:
    family_ui: "'DM Sans', Arial, sans-serif"
    family_display: "'Newsreader', Georgia, serif"
    base_size_px: 16
    scale_px: [12, 14, 16, 20, 24, 32, 48, 72, 116]
    line_heights: [1.08, 1.25, 1.6, 1.8]
    weights: [400, 500, 600, 700]
  spacing:
    base_px: 4
    scale_px: [0, 4, 8, 12, 16, 24, 32, 48, 64, 96, 128]
  radius:
    sm: 4
    md: 10
    lg: 20
    pill: 999
  shadow:
    sm: "0 2px 10px rgba(17,43,42,.06)"
    md: "0 12px 32px rgba(17,43,42,.09)"
    overlay: "0 32px 88px rgba(17,43,42,.18)"
  layout:
    content_max_width_px: 1380
    reading_max_width_ch: 70
    page_gutter_px: {mobile: 20, tablet: 32, desktop: 64}
breakpoints:
  mobile: 0
  tablet: 700
  desktop: 1024
  wide: 1440
responsive_rules:
  navigation:
    mobile: accessible button with aria-expanded, Escape close, menu focus management
    desktop: visible horizontal links and a single directory CTA
  grids:
    mobile_columns: 1
    tablet_columns: 2
    desktop_columns: 3
  typography_behavior: fluid
  overflow_policy: wrap
  minimum_touch_target_px: 44
  content_stress: [320px viewport, long business names, zero directory results]
components:
  button:
    variants: [primary, secondary, text]
    sizes: [default]
    states: [default, hover, focus-visible, active, disabled, loading]
  input:
    states: [empty, populated, focus, disabled, error, success]
    requirements: [persistent-label, error-association, keyboard-operable]
  card:
    variants: [feature, story, directory, compact]
    states: [default, hover, focus-visible, empty]
  navigation:
    states: [closed, open, keyboard-focus, active-page]
  directory:
    states: [populated, filtered, empty, clear-filters]
  submission:
    states: [not-open, invalid, submitting, success, server-error]
  dialog:
    enabled: false
  table:
    enabled: false
page_states:
  required: [populated, empty, error, offline]
  destructive_confirmation: false
  optimistic_update_policy: none
accessibility:
  target: WCAG-2.2-AA
  keyboard_complete: true
  focus_visible: true
  semantic_html: true
  form_errors_programmatic: true
  color_not_only_signal: true
  contrast:
    normal_text: 4.5
    large_text: 3.0
    ui_components: 3.0
motion:
  durations_ms: {instant: 0, fast: 120, standard: 200, deliberate: 320}
  easing:
    enter: "cubic-bezier(.2,.8,.2,1)"
    exit: "cubic-bezier(.4,0,1,1)"
    move: "cubic-bezier(.2,.8,.2,1)"
  animate: [opacity, transform]
  avoid: [layout-thrashing-properties, autoplay-video, essential-content-reveal]
  reduced_motion: remove-nonessential-and-preserve-state-feedback
content:
  voice: precise, plain English, credible editorial reporting
  reading_level: plain language suitable for business readers
  button_style: verb-first
  error_style: explain-problem-and-next-action
  placeholder_is_not_label: true
  ownership_disclosures: preserve existing transparency text
  claims: never invent rankings, awards, testimonials or company performance
implementation:
  framework: zero-dependency Node 22 static generator and vanilla JavaScript
  styling: tokenized CSS, progressively enhanced
  component_location: scripts/generate.mjs
  token_location: public/styles.css
  icon_source: inline SVG and accessible unicode where appropriate
  allowed_dependencies: []
  prohibited_dependencies: [animation libraries, full UI frameworks, tracking SDKs]
quality_gates:
  viewports: [320x720, 360x800, 390x844, 768x1024, 1280x800, 1440x900]
  browsers: [chromium, webkit]
  tests:
    - generated-route-integrity
    - no-horizontal-overflow
    - 44px-touch-targets
    - keyboard-navigation
    - accessible-name-and-role
    - focus-order
    - color-contrast
    - directory-filter-empty-reset
    - submission-prelaunch-state
    - reduced-motion
    - no-javascript-fallback
    - visual-screenshot-review
release:
  production_deployment: requires founder approval
  review_site: Cloudflare Pages branch preview only until review
  indexing: disabled
