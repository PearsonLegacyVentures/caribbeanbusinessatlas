name: Review build checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - name: Verify 320px–1440px layouts and interactive states in Chromium
        run: npm run qa:browser
      - name: Verify current article routes in generated output
        run: |
          test -f dist/sitemap.xml
          test -f dist/stories/tranquilitas-msme-innovative-business-nomination-2026/index.html
          test -f dist/stories/tranquilitas-mobile-spa-service-innovation-bahamas/index.html
          grep -q "tranquilitas-msme-innovative-business-nomination-2026" dist/sitemap.xml
          grep -q "tranquilitas-mobile-spa-service-innovation-bahamas" dist/sitemap.xml
