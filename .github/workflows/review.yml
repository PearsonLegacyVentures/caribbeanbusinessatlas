name: Review build checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - name: Verify 320px–1440px layouts and interactive states in Chromium
        run: npm run qa:browser
      - name: Verify generated site matches committed output
        run: git diff --exit-code -- dist
